<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Survivor Island | 3D Terrain Blueprint</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#102e36;color:#f7f3e4;font:14px system-ui,sans-serif}
canvas{display:block}#panel{position:fixed;top:12px;left:12px;max-width:330px;background:#112c33eb;padding:14px;border:1px solid #ffffff55;border-radius:12px}
h1{font-size:18px;margin:0 0 7px}p{margin:7px 0}button,a{color:#fff}button{background:#28626a;border:1px solid #fff8;border-radius:6px;padding:7px;cursor:pointer}
#detail{font-size:12px;color:#e6e0b9}#map{width:145px;max-width:35vw;display:block;border-radius:6px;margin-top:8px}
#toolbar{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:#112c33eb;padding:8px;border-radius:9px;display:flex;gap:8px}
@media(max-width:600px){#panel{max-width:210px;font-size:11px}h1{font-size:14px}#map{width:100px}#toolbar{width:94%;justify-content:center}}
</style></head><body>
<div id="panel"><h1>Survivor Island · 3D Terrain Blueprint</h1>
<p>First-pass island geometry, paths and landmarks. <strong>Positions are provisional</strong>; this is not the finished game.</p>
<p id="detail">Click a landmark marker to inspect its evidence.</p>
<img id="map" src="../../Assets/map.png" alt="Original island illustration">
<a href="/" style="display:block;margin-top:8px">← Original Survivor Island</a></div>
<div id="toolbar"><button id="reset">Reset camera</button><button id="labels">Toggle labels</button><button id="paths">Toggle paths</button></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js';
import {ISLAND_NODES,ISLAND_EDGES,ISLAND_OUTLINE} from './layout.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#7bbfc3');
const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.1,500);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);document.body.prepend(renderer.domElement);
const ambient=new THREE.HemisphereLight('#e9faff','#28534b',2.5);scene.add(ambient);
const light=new THREE.DirectionalLight('#fff0cd',2.8);light.position.set(-60,100,35);scene.add(light);
const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:.92});
const sand=mat('#dfc18a'),green=mat('#5a965a'),path=mat('#ad9268'),trunk=mat('#8e6642'),frond=mat('#347b49');
const sea=new THREE.Mesh(new THREE.PlaneGeometry(340,340),new THREE.MeshStandardMaterial({color:'#238f9c',roughness:.3}));sea.rotation.x=-Math.PI/2;sea.position.y=-1.8;scene.add(sea);
const shape=new THREE.Shape();ISLAND_OUTLINE.forEach(([x,z],i)=>i?shape.lineTo(x,-z):shape.moveTo(x,-z));shape.closePath();
const landGeo=new THREE.ExtrudeGeometry(shape,{depth:2,bevelEnabled:true,bevelSize:2,bevelThickness:.6,bevelSegments:1,curveSegments:1});
landGeo.rotateX(-Math.PI/2);const land=new THREE.Mesh(landGeo,sand);land.position.y=0;scene.add(land);
const jungle=new THREE.Mesh(new THREE.SphereGeometry(1,24,16),green);jungle.scale.set(37,3,44);jungle.position.set(3,.8,12);scene.add(jungle);
function cylinder(r1,r2,h,x,y,z,m){const o=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,7),m);o.position.set(x,y,z);scene.add(o);return o}
function tree(x,z,s){cylinder(.28*s,.4*s,5*s,x,3.3*s,z,trunk);for(let i=0;i<5;i++){const a=i*6.283/5;const c=new THREE.Mesh(new THREE.ConeGeometry(2.1*s,5*s,5),frond);c.position.set(x+Math.cos(a)*1.2*s,6.5*s,z+Math.sin(a)*1.2*s);c.rotation.z=Math.cos(a)*.6;c.rotation.x=Math.sin(a)*.6;scene.add(c)}}
let seed=2103;const rnd=()=>{seed=(1664525*seed+1013904223)>>>0;return seed/4294967296};
for(let i=0;i<130;i++){const x=(rnd()-.5)*74+3,z=(rnd()-.5)*86+12;
if(Object.values(ISLAND_NODES).some(n=>Math.hypot(n.x-x,n.z-z)<7))continue;
if((x/39)**2+((z-12)/46)**2>1)continue;tree(x,z,.45+rnd()*.4)}
const pathGroup=new THREE.Group();scene.add(pathGroup);
for(const [a,b] of ISLAND_EDGES){const p=ISLAND_NODES[a],q=ISLAND_NODES[b],dx=q.x-p.x,dz=q.z-p.z;
const length=Math.hypot(dx,dz);const strip=new THREE.Mesh(new THREE.BoxGeometry(1.8,.13,length),path);
strip.position.set((p.x+q.x)/2,2.5,(p.z+q.z)/2);strip.rotation.y=Math.atan2(dx,dz);pathGroup.add(strip)}
// Landmark markers and lightweight canvas text labels.
const markers=[],labels=new THREE.Group();scene.add(labels);
function labelTexture(text){const c=document.createElement('canvas');c.width=512;c.height=96;const g=c.getContext('2d');
g.fillStyle='#14363bdd';g.fillRect(0,0,512,96);g.font='bold 32px sans-serif';g.fillStyle='#fff';g.textAlign='center';g.fillText(text,256,60);
const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t}
for(const [key,n] of Object.entries(ISLAND_NODES)){const m=cylinder(1.45,1.7,2,n.x,4,n.z,mat(n.source==='illustration'?'#f9a94b':'#bd82c8'));m.userData.key=key;markers.push(m);
const sprite=new THREE.Sprite(new THREE.SpriteMaterial({map:labelTexture(n.label),depthTest:false}));sprite.position.set(n.x,10,n.z);sprite.scale.set(15,2.8,1);labels.add(sprite)}
// Camp markers: fire, shelter and flag (placeholder geometry).
const flame=new THREE.Mesh(new THREE.ConeGeometry(1.8,4,8),mat('#f77c2d'));flame.position.set(-9,5,-31);scene.add(flame);
const hut=new THREE.Mesh(new THREE.ConeGeometry(7,5,4),mat('#a27a40'));hut.rotation.y=Math.PI/4;hut.position.set(12,7,-44);scene.add(hut);
const flagpole=cylinder(.2,.2,9,-24,7,-25,trunk);
const flag=new THREE.Mesh(new THREE.PlaneGeometry(4,2.5),mat('#e4a02d'));flag.position.set(-22,10,-25);scene.add(flag);
const ray=new THREE.Raycaster(),pointer=new THREE.Vector2();
renderer.domElement.addEventListener('click',e=>{pointer.set(e.clientX/innerWidth*2-1,1-e.clientY/innerHeight*2);ray.setFromCamera(pointer,camera);
const hit=ray.intersectObjects(markers)[0];if(hit){const n=ISLAND_NODES[hit.object.userData.key];document.querySelector('#detail').textContent=n.label+' — '+n.source+'; coordinates are proposed, not measured.'}});
let theta=0.25,phi=.8,dist=205,target=new THREE.Vector3(0,0,0),drag=false,px=0,py=0;
function view(){camera.position.set(target.x+dist*Math.sin(phi)*Math.sin(theta),target.y+dist*Math.cos(phi),target.z+dist*Math.sin(phi)*Math.cos(theta));camera.lookAt(target)}
renderer.domElement.addEventListener('pointerdown',e=>{drag=true;px=e.clientX;py=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});
renderer.domElement.addEventListener('pointerup',()=>drag=false);
renderer.domElement.addEventListener('pointermove',e=>{if(!drag)return;theta-=(e.clientX-px)*.005;phi=Math.max(.12,Math.min(1.3,phi+(e.clientY-py)*.005));px=e.clientX;py=e.clientY;view()});
renderer.domElement.addEventListener('wheel',e=>{dist=Math.max(75,Math.min(300,dist+e.deltaY*.12));view()},{passive:true});
document.querySelector('#reset').onclick=()=>{theta=.25;phi=.8;dist=205;view()};
document.querySelector('#labels').onclick=()=>labels.visible=!labels.visible;
document.querySelector('#paths').onclick=()=>pathGroup.visible=!pathGroup.visible;
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);view()});
view();renderer.setAnimationLoop(()=>renderer.render(scene,camera));
</script></body></html>
